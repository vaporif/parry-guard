[graph]
targets = []
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained — transitive dep from tokenizers" },
  { id = "RUSTSEC-2026-0367", reason = "zip 8.x pinned by candle-core 0.11; advisory only affects extract(), which candle never calls" },
  { id = "RUSTSEC-2026-0368", reason = "zip 8.x pinned by candle-core 0.11; advisory only affects extract(), which candle never calls" },
  { id = "RUSTSEC-2026-0369", reason = "zip 8.x pinned by candle-core 0.11; advisory only affects extract(), which candle never calls" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
